<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Przykładowa Strona</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
        }
        .menu {
            background-color: #333;
            height: 100px;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 40%);
        }
        .menu a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size:smaller;
            
        }
        .menu a:hover {
            background-color: #ddd;
            color: rgb(55, 132, 199);
        }
        .section {
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <a href="#onas">O nas</a>
        <a href="#misja">Misja</a>
        <a href="#kontakt">Kontakt</a>
    </div>

    <!-- Sekcje strony -->
    <div id="onas" class="section">
        <h1>O nas</h1>
        <p>Informacje o naszej firmie...</p>
    </div>
    <div id="misja" class="section">
        <h1>Misja</h1>
        <p>Opis naszej misji...</p>
    </div>
    <div id="kontakt" class="section">
        <h1>Kontakt</h1>
        <p>Dane kontaktowe...</p>
    </div>
</body>
</html>
